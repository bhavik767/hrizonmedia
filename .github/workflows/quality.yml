name: Quality

on:
  pull_request:
    branches:
      - master
      - fix/salad-staging-bootstrap
  push:
    branches:
      - master
      - fix/salad-staging-bootstrap

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm exec vitest -- run --config vitest.config.mts --pool=threads --maxWorkers=1 tests/int/dashboard-ui.int.spec.tsx
      - run: npm run build
